<!doctype html><meta charset="utf-8"><title>Gemi önizleme</title>
<style>body{margin:0;background:#0b0f24}canvas{display:block}</style>
<script type="module">
// Gemiyi oyunun ışıklarıyla çizer. Varsayılan: üç açı yan yana. ?konsept: konsept görselin açısından tek kare.
// ?konsept=x,y,z,yatış kamerayı değiştirir. Seçenekler: ?shape=ok|kartal  ?hull=kar ...  (hangardaki kimlikler)
import * as THREE from '../vendor/three.bundle.min.js';
import { buildShip, styleShip } from '../src/render/models.js';
import { lookOf } from '../src/content/hangar.js';
const q = new URLSearchParams(location.search), solo = q.has('konsept');
const W = solo ? 900 : 1500, H = solo ? 900 : 500, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
r.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070b1a);
scene.add(new THREE.HemisphereLight(0xb9c8ff, 0x241446, 1.3));
const k = new THREE.DirectionalLight(0xfff3e0, 2.6); k.position.set(-6, 12, 8);
const rim = new THREE.DirectionalLight(0x56e0ff, 1.6); rim.position.set(7, 4, -10);
const m = new THREE.DirectionalLight(0xff5fd0, 0.6); m.position.set(-9, 2, -3); scene.add(k, rim, m);
const ship = buildShip(); scene.add(ship);
styleShip(ship, lookOf(Object.fromEntries(q)));
const views = solo ? [(q.get('konsept') || '1.5,2.7,-2.3,0').split(',').map(Number)] : [[0, 6, 0.01, 0], [0, 4.2, 3.6, 0], [3.2, 1.6, 2.6, 0]], n = views.length;
views.forEach(([x, y, z, roll], i) => {
  const cam = new THREE.PerspectiveCamera(solo ? 38 : 30, (W / n) / H, 0.1, 50);
  cam.position.set(x, y, z); cam.lookAt(0, 0.05, -0.1); cam.rotateZ(roll);
  r.setViewport(i * W / n, 0, W / n, H); r.setScissor(i * W / n, 0, W / n, H); r.render(scene, cam);
});
document.title = 'hazir';
</script>
