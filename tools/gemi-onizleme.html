<!doctype html><meta charset="utf-8"><title>Gemi önizleme</title>
<style>body{margin:0;background:#0b0f24}canvas{display:block}</style>
<script type="module">
import * as THREE from '../vendor/three.bundle.min.js';
import { buildShip, styleShip } from '../src/render/models.js';
import { lookOf } from '../src/content/hangar.js';
const W = 1200, H = 400, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
r.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0f24);
scene.add(new THREE.HemisphereLight(0xb9c8ff, 0x241446, 1.3));
const k = new THREE.DirectionalLight(0xfff3e0, 2.6); k.position.set(-6, 12, 8);
const rim = new THREE.DirectionalLight(0x56e0ff, 1.6); rim.position.set(7, 4, -10);
const m = new THREE.DirectionalLight(0xff5fd0, 0.6); m.position.set(-9, 2, -3); scene.add(k, rim, m);
const ship = buildShip(); scene.add(ship);
const q = new URLSearchParams(location.search);
try { styleShip(ship, lookOf({ shape: q.get('shape') || 'klasik' })); } catch (e) { console.log(e); }
const views = [[0, 6, 0.01], [0, 4.2, 3.6], [3.2, 1.6, 2.6]];
views.forEach(([x, y, z], i) => {
  const cam = new THREE.PerspectiveCamera(30, (W / 3) / H, 0.1, 50);
  cam.position.set(x, y, z); cam.lookAt(0, 0, 0);
  r.setViewport(i * W / 3, 0, W / 3, H); r.setScissor(i * W / 3, 0, W / 3, H); r.render(scene, cam);
});
document.title = 'hazir';
</script>
